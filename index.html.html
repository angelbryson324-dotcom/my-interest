<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>School Results Management System</title>
<style>
:root{--primary:#243b80;--secondary:#526ee8;--bg:#f3f6fc;--text:#1e293b;--muted:#64748b;--white:#fff;--danger:#dc2626;--success:#15803d}
*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--text)}
button,input,select{font:inherit}button{cursor:pointer;border:0;border-radius:8px;padding:10px 14px;background:var(--secondary);color:#fff;font-weight:600}button:hover{filter:brightness(.94)}.btn-dark{background:var(--primary)}.btn-red{background:var(--danger)}.btn-green{background:var(--success)}.btn-light{background:#e8edff;color:var(--primary)}
.login-wrap{min-height:100vh;display:grid;place-items:center;padding:20px;background:linear-gradient(135deg,#243b80,#526ee8)}.login-card{background:#fff;width:min(440px,100%);padding:32px;border-radius:18px;box-shadow:0 20px 60px #15265a55}.brand{text-align:center;margin-bottom:24px}.brand .logo{font-size:44px}.brand h1{font-size:23px;margin:8px 0}.brand p{color:var(--muted);margin:0}.field{display:flex;flex-direction:column;gap:7px;margin:14px 0}.field label{font-weight:600;font-size:14px}.field input,.field select{padding:12px;border:1px solid #cbd5e1;border-radius:8px;background:#fff;width:100%}.hint{font-size:12px;color:var(--muted);line-height:1.5}.login-error{color:var(--danger);font-size:13px;min-height:18px}
.app{display:none;min-height:100vh}.sidebar{position:fixed;inset:0 auto 0 0;width:250px;background:#1d2e67;color:#fff;padding:20px;overflow-y:auto}.side-brand{font-size:19px;font-weight:800;margin-bottom:28px}.side-brand small{display:block;font-size:11px;color:#cbd5e1;margin-top:5px}.nav{display:grid;gap:7px}.nav button{background:transparent;color:#dbeafe;text-align:left;padding:12px}.nav button.active,.nav button:hover{background:#3d55a2;color:#fff}.main{margin-left:250px;padding:24px;min-width:0}.topbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:22px}.topbar h2{margin:0}.user-chip{background:#fff;border:1px solid #e2e8f0;border-radius:30px;padding:8px 12px;font-size:13px}.content{display:grid;gap:18px}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}.stat,.panel{background:#fff;border-radius:14px;padding:18px;box-shadow:0 3px 15px #0f172a08;border:1px solid #e8edf5}.stat .label{color:var(--muted);font-size:13px}.stat .value{font-size:28px;font-weight:800;margin-top:9px}.panel h3{margin:0 0 16px}.panel-head{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:14px}.toolbar{display:flex;gap:8px;flex-wrap:wrap}.toolbar input,.toolbar select{padding:9px;border:1px solid #cbd5e1;border-radius:8px;background:white}
table{width:100%;border-collapse:collapse;min-width:650px}th,td{text-align:left;padding:11px;border-bottom:1px solid #e8edf5;font-size:13px}th{background:#f8fafc;color:#475569}td .actions{display:flex;gap:6px;flex-wrap:wrap}.table-wrap{overflow:auto}.empty{text-align:center;color:var(--muted);padding:24px}.badge{padding:4px 8px;border-radius:20px;background:#e0e7ff;color:#3730a3;font-size:11px;font-weight:700}.badge.pending{background:#fef3c7;color:#92400e}.badge.approved{background:#dcfce7;color:#166534}.badge.late{background:#fee2e2;color:#991b1b}.form-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.form-grid .field{margin:0}.form-actions{display:flex;gap:8px;align-items:end}.notice{background:#eff6ff;border:1px solid #bfdbfe;padding:12px;border-radius:10px;font-size:13px;color:#1e40af}.hidden{display:none!important}
@media(max-width:1000px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.form-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:700px){.sidebar{position:static;width:100%;height:auto}.nav{grid-template-columns:repeat(2,1fr)}.app{display:none}.main{margin-left:0;padding:14px}.stats{grid-template-columns:1fr 1fr}.form-grid{grid-template-columns:1fr}.login-card{padding:24px}}
</style>
</head>
<body>
<div id="loginScreen" class="login-wrap">
  <div class="login-card">
    <div class="brand"><div class="logo">🏫</div><h1>School Results System</h1><p>Advanced Edition · Prototype</p></div>
    <form id="loginForm">
      <div class="field"><label>Username</label><input id="username" required placeholder="Ingiza username"></div>
      <div class="field"><label>Password</label><input id="password" type="password" required placeholder="Ingiza password"></div>
      <div class="field"><label>Role</label><select id="role"><option value="admin">Administrator</option><option value="teacher">Teacher</option></select></div>
      <div id="loginError" class="login-error"></div>
      <button style="width:100%;padding:13px" type="submit">Login</button>
    </form>
    <p class="hint" style="margin-top:16px">Demo Admin: <b>admin / admin123</b><br>Demo Teacher: <b>teacher / teacher123</b></p>
    <p class="hint">Tahadhari: login hii ni ya majaribio; si usalama wa production.</p>
  </div>
</div>

<div id="app" class="app">
  <aside class="sidebar">
    <div class="side-brand">🏫 SCHOOL RMS<small>Results Management System</small></div>
    <div id="nav" class="nav"></div>
    <button id="logoutBtn" class="btn-red" style="width:100%;margin-top:25px">↪ Logout</button>
  </aside>
  <main class="main">
    <div class="topbar"><h2 id="pageTitle">Dashboard</h2><div class="user-chip" id="userChip"></div></div>
    <div id="page" class="content"></div>
  </main>
</div>

<script>
const COMBINATIONS=['PMCs','PCM','PCB','CBG','EGM','HKL','HGL','HGK','HGE','HGLi','HGFa'];
const SUBJECTS=['Mathematics','Physics','Chemistry','Biology','English','Kiswahili','Geography','History','Economics','Commerce','Computer Science','General Studies'];
const DEMO_USERS={admin:{password:'admin123',role:'admin',name:'Administrator'},teacher:{password:'teacher123',role:'teacher',name:'Demo Teacher'}};
let currentUser=null, currentPage='dashboard';
let db=JSON.parse(localStorage.getItem('schoolRMS_demo')||'null')||{students:[],results:[],deadlines:[],submissions:[],subjects:[...SUBJECTS],teachers:[{username:'teacher',name:'Demo Teacher',subject:'Mathematics'}],accounts:[],resultsPublished:false,publishedAt:null};
db.accounts=db.accounts||[];db.resultsPublished=db.resultsPublished||false;db.publishedAt=db.publishedAt||null;
function save(){localStorage.setItem('schoolRMS_demo',JSON.stringify(db))}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function id(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function avg(arr){return arr.length?arr.reduce((a,b)=>a+b,0)/arr.length:0}
function grade(score){return score>=ယ်80?'A':score>=70?'B':score>=60?'C':score>=50?'D':score>=40?'E':'F'}

function grade(score){return score>=80?'A':score>=70?'B':score>=60?'C':score>=50?'D':score>=40?'E':'F'}
function login(e){e.preventDefault();const u=username.value.trim(),p=password.value,r=role.value;let found=DEMO_USERS[u]||db.accounts.find(a=>a.username===u);if(!found||found.password!==p||found.role!==r){loginError.textContent='Username, password au role si sahihi.';return}currentUser={username:u,role:r,name:found.name};loginError.textContent='';loginScreen.style.display='none';app.style.display='block';userChip.textContent=currentUser.name+' · '+currentUser.role.toUpperCase();renderNav();go('dashboard')}
loginForm.addEventListener('submit',login);
logoutBtn.addEventListener('click',()=>{currentUser=null;app.style.display='none';loginScreen.style.display='grid';loginForm.reset()});
function renderNav(){const items=[['dashboard','📊 Dashboard'],['teachers','👩‍🏫 Teachers'],['students','👨‍🎓 Students'],['results','📝 Results'],['deadlines','📅 Deadlines'],['submissions','📥 Submissions'],['reports','📄 Reports']];nav.innerHTML=items.map(([key,label])=>`<button class="${currentPage===key?'active':''}" onclick="go('${key}')">${label}</button>`).join('')}
function go(page){currentPage=page;pageTitle.textContent=({dashboard:'Dashboard',teachers:'Teachers Management',students:'Students Management',results:'Results Management',deadlines:'Deadlines Management',submissions:'Teacher Submissions',reports:'Reports Processing'})[page];renderNav();renderPage()}
function statCard(label,value,icon){return `<div class="stat"><div class="label">${icon} ${label}</div><div class="value">${value}</div></div>`}
function renderPage(){if(currentPage==='dashboard')dashboard();else if(currentPage==='teachers')teachersPage();else if(currentPage==='students')studentsPage();else if(currentPage==='results')resultsPage();else if(currentPage==='deadlines')deadlinesPage();else if(currentPage==='submissions')submissionsPage();else if(currentPage==='reports')reportsPage()}
function dashboard(){let notification=currentUser.role==='teacher'?`<section class="panel"><h3>🔔 Taarifa za Matokeo</h3>${db.resultsPublished?`<div class="notice"><b>Matokeo yametangazwa!</b> Walimu wanaweza kuingia kwenye mfumo na kuona matokeo/report. Tarehe: ${db.publishedAt?new Date(db.publishedAt).toLocaleString():'-'}</div>`:'<div class="notice">Bado matokeo hayajatangazwa na Administrator. Taarifa itaonekana hapa yakishatolewa.</div>'}</section>`:`<section class="panel"><h3>📢 Kutangaza Matokeo</h3><p>Hali ya matokeo: ${db.resultsPublished?'<span class="badge approved">Yametangazwa</span>':'<span class="badge pending">Bado hayajatangazwa</span>'}</p><button class="btn-green" onclick="publishResults()">${db.resultsPublished?'Tangazo lipo tayari — Tangaza tena':'Tangaza Matokeo kwa Walimu'}</button><p class="hint">Walimu walioundiwa akaunti wataona taarifa hii wanapo-login kwenye browser inayoshiriki data hii.</p></section>`;page.innerHTML=`<div class="stats">${statCard('Total Students',db.students.length,'👨‍🎓')}${statCard('Results Entered',db.results.length,'📝')}${statCard('Deadlines',db.deadlines.length,'📅')}${statCard('Submissions',db.submissions.length,'📥')}</div><section class="panel"><h3>Karibu, ${esc(currentUser.name)}!</h3><p>School Results Management System ni prototype inayotumia browser storage (localStorage).</p><div class="notice">Data huhifadhiwa kwenye browser hii tu. Mfumo huu bado hauna backend/database ya online.</div></section>${notification}<section class="panel"><h3>Recent Results</h3>${table(['Student','Subject','Exam','Score','Grade'],db.results.slice(-6).reverse().map(r=>[studentName(r.studentId),r.subject,r.exam,r.score,grade(Number(r.score))]))}</section>`}
function publishResults(){if(!confirm('Unatangaza matokeo kwa walimu wote wenye akaunti kwenye mfumo huu?'))return;db.resultsPublished=true;db.publishedAt=new Date().toISOString();save();dashboard()}
function studentName(sid){return db.students.find(s=>s.id===sid)?.name||'Student removed'}
function table(headers,rows){if(!rows.length)return '<div class="empty">Hakuna taarifa bado.</div>';return `<div class="table-wrap"><table><thead><tr>${headers.map(h=>`<th>${esc(h)}</th>`).join('')}</tr></thead><tbody>${rows.map(row=>`<tr>${row.map(v=>`<td>${v}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`}
function teachersPage(){page.innerHTML=`<section class="panel"><h3>Register Teacher & Subject</h3><form id="teacherForm" class="form-grid"><div class="field"><label>Jina kamili la mwalimu</label><input name="name" required placeholder="Mf. Mwalimu John"></div><div class="field"><label>Somo analofundisha</label><select name="subject">${db.subjects.map(s=>`<option>${esc(s)}</option>`).join('')}</select></div><div class="field"><label>Username ya Login</label><input name="username" required placeholder="Mf. john"></div><div class="field"><label>Password ya Login</label><input name="password" type="password" required minlength="4" placeholder="Weka password"></div><div class="form-actions"><button>Save Teacher & Login Account</button></div></form></section><section class="panel"><h3>Walimu Waliosajiliwa (${db.teachers.length})</h3>${table(['Jina la Mwalimu','Somo','Username','Action'],db.teachers.map((t,i)=>[esc(t.name),esc(t.subject),esc(t.username||'-'),`<button class="btn-red" onclick="deleteTeacher(${i})">Delete</button>`]))}</section>`;document.getElementById('teacherForm').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target),name=f.get('name').trim();if(db.teachers.some(t=>t.name.toLowerCase()===name.toLowerCase()&&t.subject===f.get('subject'))){alert('Mwalimu huyu tayari amesajiliwa kwa somo hili.');return}let username=f.get('username').trim(),password=f.get('password');if(DEMO_USERS[username]||db.accounts.some(a=>a.username===username)){alert('Username tayari imetumika.');return}db.teachers.push({name,subject:f.get('subject'),username});db.accounts.push({username,password,role:'teacher',name});save();teachersPage()}}
function deleteTeacher(i){if(confirm('Unataka kufuta mwalimu huyu?')){db.teachers.splice(i,1);save();teachersPage()}}
function studentsPage(){page.innerHTML=`<section class="panel"><div class="panel-head"><h3>Add Student</h3></div><form id="studentForm" class="form-grid"><div class="field"><label>Full name</label><input name="name" required></div><div class="field"><label>Admission number</label><input name="adm" required></div><div class="field"><label>Class</label><select name="cls"><option>Form 5</option><option>Form 6</option></select></div><div class="field"><label>Combination</label><select name="comb">${COMBINATIONS.map(c=>`<option>${c}</option>`).join('')}</select></div><div class="form-actions"><button>Add Student</button></div></form></section><section class="panel"><div class="panel-head"><h3>Students List (${db.students.length})</h3><input id="studentSearch" placeholder="Search student..."></div><div id="studentsTable"></div></section>`;document.getElementById('studentForm').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target);if(db.students.some(s=>s.adm===f.get('adm'))){alert('Admission number tayari ipo');return}db.students.push({id:id(),name:f.get('name'),adm:f.get('adm'),cls:f.get('cls'),comb:f.get('comb')});save();studentsPage()};document.getElementById('studentSearch').oninput=e=>drawStudents(e.target.value);drawStudents('')}
function drawStudents(q){let rows=db.students.filter(s=>(s.name+' '+s.adm+' '+s.comb).toLowerCase().includes(q.toLowerCase())).map(s=>[esc(s.name),esc(s.adm),esc(s.cls),esc(s.comb),`<button class="btn-red" onclick="deleteStudent('${s.id}')">Delete</button>`]);document.getElementById('studentsTable').innerHTML=table(['Name','Admission','Class','Combination','Action'],rows)}
function deleteStudent(sid){if(confirm('Unataka kufuta mwanafunzi?')){db.students=db.students.filter(s=>s.id!==sid);db.results=db.results.filter(r=>r.studentId!==sid);save();studentsPage()}}
function resultsPage(){page.innerHTML=`<section class="panel"><h3>Enter Result</h3><form id="resultForm" class="form-grid"><div class="field"><label>Student</label><select name="student" required>${db.students.map(s=>`<option value="${s.id}">${esc(s.name)} (${esc(s.adm)})</option>`).join('')}</select></div><div class="field"><label>Subject</label><select name="subject">${db.subjects.map(s=>`<option>${esc(s)}</option>`).join('')}</select></div><div class="field"><label>Teacher wa somo</label><select name="teacher">${db.teachers.map(t=>`<option value="${esc(t.name)}">${esc(t.name)} — ${esc(t.subject)}</option>`).join('')}</select></div><div class="field"><label>Exam</label><select name="exam"><option>Test</option><option>Midterm</option><option>Terminal</option><option>Annual</option></select></div><div class="field"><label>Score (0-100)</label><input name="score" type="number" min="0" max="100" required></div><div class="form-actions"><button>Save Result</button></div></form></section><section class="panel"><div class="panel-head"><h3>Results</h3><div class="toolbar"><button class="btn-green" onclick="publishResults()">Tangaza Results</button><button class="btn-light" onclick="exportResults()">Export CSV</button></div></div><h3>Overall Position Ranking</h3>${overallRankingTable()}${table(['Student','Subject','Exam','Score','Grade','Teacher','Action'],db.results.slice().reverse().map(r=>[esc(studentName(r.studentId)),esc(r.subject),esc(r.exam),r.score,grade(Number(r.score)),esc(r.teacher),`<button class="btn-red" onclick="deleteResult('${r.id}')">Delete</button>`]))}</section>`;document.getElementById('resultForm').onsubmit=e=>{e.preventDefault();if(!db.students.length){alert('Ongeza mwanafunzi kwanza');return}let f=new FormData(e.target),score=Number(f.get('score'));if(score<0||score>100){alert('Score lazima iwe 0 hadi 100');return}db.results.push({id:id(),studentId:f.get('student'),subject:f.get('subject'),exam:f.get('exam'),score,teacher:f.get('teacher')||currentUser.name,date:new Date().toISOString()});save();resultsPage()}}
function deleteResult(rid){if(confirm('Futa result hii?')){db.results=db.results.filter(r=>r.id!==rid);save();resultsPage()}}
function deadlinesPage(){page.innerHTML=`<section class="panel"><h3>Create Deadline</h3><form id="deadlineForm" class="form-grid"><div class="field"><label>Title</label><input name="title" required placeholder="Mf. Terminal exam results"></div><div class="field"><label>Class</label><select name="cls"><option>Form 5</option><option>Form 6</option><option>All Classes</option></select></div><div class="field"><label>Deadline</label><input type="datetime-local" name="date" required></div><div class="form-actions"><button>Create Deadline</button></div></form></section><section class="panel"><h3>Deadlines</h3>${table(['Title','Class','Due date','Status','Action'],db.deadlines.map(d=>[esc(d.title),esc(d.cls),esc(d.date),new Date(d.date)<new Date()?'<span class="badge late">Expired</span>':'<span class="badge pending">Open</span>',`<button class="btn-red" onclick="deleteDeadline('${d.id}')">Delete</button>`]))}</section>`;document.getElementById('deadlineForm').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target);db.deadlines.push({id:id(),title:f.get('title'),cls:f.get('cls'),date:f.get('date')});save();deadlinesPage()}}
function deleteDeadline(did){db.deadlines=db.deadlines.filter(d=>d.id!==did);save();deadlinesPage()}
function submissionsPage(){page.innerHTML=`<section class="panel"><h3>Submit Results (Teacher)</h3><form id="submissionForm" class="form-grid"><div class="field"><label>Class</label><select name="cls"><option>Form 5</option><option>Form 6</option></select></div><div class="field"><label>Combination</label><select name="comb">${COMBINATIONS.map(c=>`<option>${c}</option>`).join('')}</select></div><div class="field"><label>Subject</label><select name="subject">${db.subjects.map(s=>`<option>${esc(s)}</option>`).join('')}</select></div><div class="field"><label>Exam</label><select name="exam"><option>Midterm</option><option>Terminal</option><option>Annual</option></select></div><div class="form-actions"><button class="btn-green">Submit</button></div></form><p class="hint">Submission hii ni rekodi ya mfano; haipandishi file.</p></section><section class="panel"><h3>Submission History</h3>${table(['Teacher','Class','Combination','Subject','Exam','Submitted','Status'],db.submissions.slice().reverse().map(s=>[esc(s.teacher),esc(s.cls),esc(s.comb),esc(s.subject),esc(s.exam),new Date(s.date).toLocaleString(),'<span class="badge approved">Submitted</span>']))}</section>`;document.getElementById('submissionForm').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target);db.submissions.push({id:id(),teacher:currentUser.name,cls:f.get('cls'),comb:f.get('comb'),subject:f.get('subject'),exam:f.get('exam'),date:new Date().toISOString()});save();submissionsPage()}}
function rankedStudents(){return db.students.map(st=>{let rs=db.results.filter(r=>r.studentId===st.id),mean=avg(rs.map(r=>Number(r.score)));return {student:st,count:rs.length,mean}}).filter(x=>x.count>0).sort((a,b)=>b.mean-a.mean)}
function overallRankingTable(){let ranked=rankedStudents();let pos=0,lastMean=null;return table(['Position','Student','Admission','Class','Combination','Subjects Count','Average','Grade'],ranked.map((x,i)=>{if(lastMean===null||x.mean!==lastMean)pos=i+1;lastMean=x.mean;return [pos,esc(x.student.name),esc(x.student.adm),esc(x.student.cls),esc(x.student.comb),x.count,x.mean.toFixed(1),grade(x.mean)]}))}
function reportsPage(){page.innerHTML=`<section class="panel"><div class="panel-head"><h3>Report ya Mwanafunzi (Independent Report)</h3></div><div class="field"><label>Chagua mwanafunzi kupata report yake binafsi</label><select id="reportStudent">${db.students.map(s=>`<option value="${s.id}">${esc(s.name)} — ${esc(s.adm)}</option>`).join('')}</select></div><div class="toolbar"><button onclick="showIndividualReport()">Tengeneza Report</button><button class="btn-light" onclick="exportReport()">Export All CSV</button></div><div id="individualReport" style="margin-top:18px"></div></section>`;if(db.students.length)showIndividualReport()}
function showIndividualReport(){let sid=document.getElementById('reportStudent')?.value,s=db.students.find(x=>x.id===sid);if(!s){document.getElementById('individualReport').innerHTML='<div class="empty">Hakuna mwanafunzi aliyechaguliwa.</div>';return}let rs=db.results.filter(r=>r.studentId===sid),mean=avg(rs.map(r=>Number(r.score))),ranked=rankedStudents(),position=ranked.findIndex(x=>x.student.id===sid)+1,subjectRows=rs.map(r=>[esc(r.subject),esc(r.exam),esc(r.teacher),r.score,grade(Number(r.score))]);let report=document.getElementById('individualReport');report.innerHTML=`<div id="printReport" class="panel" style="border:2px solid #243b80"><div style="text-align:center"><h2>🏫 SCHOOL RESULTS REPORT</h2><h3>Student Academic Report</h3></div><hr><p><b>Student Name:</b> ${esc(s.name)} &nbsp; <b>Admission No:</b> ${esc(s.adm)}</p><p><b>Class:</b> ${esc(s.cls)} &nbsp; <b>Combination:</b> ${esc(s.comb)}</p><p><b>Number of Results:</b> ${rs.length} &nbsp; <b>Average:</b> ${mean.toFixed(1)} &nbsp; <b>Overall Grade:</b> ${rs.length?grade(mean):'-'}</p><p><b>Overall Position:</b> ${rs.length?position+' / '+ranked.length:'-'}</p>${table(['Subject','Exam','Subject Teacher','Score','Grade'],subjectRows)}<div style="display:flex;justify-content:space-between;margin-top:35px"><span>Class Teacher: __________________</span><span>Head of School: __________________</span></div><p style="text-align:center;font-size:12px;margin-top:25px">Generated on ${new Date().toLocaleDateString()}</p></div><button class="btn-dark" style="margin-top:12px" onclick="printIndividualReport()">Print / Save as PDF</button>`}
function printIndividualReport(){let content=document.getElementById('printReport');if(!content)return;let w=window.open('','_blank');w.document.write('<html><head><title>Student Report</title><style>body{font-family:Arial;padding:25px}table{width:100%;border-collapse:collapse}th,td{border:1px solid #ccc;padding:9px;text-align:left}th{background:#eee}</style></head><body>'+content.outerHTML+'</body></html>');w.document.close();w.print()}
function csvDownload(filename,rows){let csv=rows.map(row=>row.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\r\n');let blob=new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8;'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=filename;a.click();URL.revokeObjectURL(url)}
function exportResults(){csvDownload('school_results.csv',[['Student','Subject','Exam','Score','Grade','Teacher'],...db.results.map(r=>[studentName(r.studentId),r.subject,r.exam,r.score,grade(Number(r.score)),r.teacher])])}
function exportReport(){csvDownload('student_report.csv',[['Student','Admission','Class','Combination','Subjects','Average','Grade'],...db.students.map(s=>{let rs=db.results.filter(r=>r.studentId===s.id),scores=rs.map(r=>Number(r.score)),m=avg(scores);return [s.name,s.adm,s.cls,s.comb,rs.length,m.toFixed(1),scores.length?grade(m):'-']})])}
